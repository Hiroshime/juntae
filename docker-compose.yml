services:
  postgres:
    image: postgres:16-alpine
    container_name: juntae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: galera
      POSTGRES_USER: galera
      POSTGRES_PASSWORD: galera
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - galera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galera -d galera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  galera-postgres-data:
