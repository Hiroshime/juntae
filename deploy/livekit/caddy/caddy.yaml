logging:
  logs:
    default:
      level: INFO

storage:
  module: file_system
  root: /data

apps:
  tls:
    certificates:
      automate:
        - voz.juntae.chamelissa.site
        - turn.juntae.chamelissa.site
    automation:
      policies:
        - subjects:
            - voz.juntae.chamelissa.site
            - turn.juntae.chamelissa.site
          issuers:
            - module: acme
              challenges:
                dns:
                  provider:
                    name: cloudflare
                    api_token: "{env.CLOUDFLARE_API_TOKEN}"

  layer4:
    servers:
      main:
        listen:
          - ":443"
        routes:
          - match:
              - tls:
                  sni:
                    - turn.juntae.chamelissa.site
            handle:
              - handler: tls
              - handler: proxy
                upstreams:
                  - dial:
                      - livekit:5349

          - match:
              - tls:
                  sni:
                    - voz.juntae.chamelissa.site
            handle:
              - handler: tls
                connection_policies:
                  - alpn:
                      - http/1.1
              - handler: proxy
                upstreams:
                  - dial:
                      - livekit:7880
