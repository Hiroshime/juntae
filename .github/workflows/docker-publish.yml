name: Publicar imagem Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da imagem, por exemplo 0.6.0
        required: true
        default: 0.6.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Determinar versão
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            VERSION="$REQUESTED_TAG"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$'; then
            echo "Tag Docker inválida: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ${{ vars.DOCKERHUB_USERNAME }}/juntae
      meta-tags: |
        type=raw,value=${{ needs.version.outputs.value }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
