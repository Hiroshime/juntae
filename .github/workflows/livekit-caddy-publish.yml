name: Publicar Caddy do LiveKit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão da imagem
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publicar imagem multi-arquitetura
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/juntae-livekit-caddy
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: deploy/livekit/caddy
          file: deploy/livekit/caddy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=livekit-caddy
          cache-to: type=gha,mode=max,scope=livekit-caddy
          provenance: mode=max
          sbom: true
