name: Publicar Caddy do LiveKit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão da imagem
        required: true
        default: "1.0.0"
        type: string
  push:
    tags:
      - "livekit-caddy-v*"

permissions:
  contents: read

jobs:
  version:
    name: Determinar versão
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - name: Validar versão
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#livekit-caddy-v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._-][a-zA-Z0-9.-]+)?$'; then
            echo "Versão inválida: $VERSION" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publicar imagem multi-arquitetura
    needs: version
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/juntae-livekit-caddy
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
            type=raw,value=latest

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: deploy/livekit/caddy
          file: deploy/livekit/caddy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=livekit-caddy
          cache-to: type=gha,mode=max,scope=livekit-caddy
          provenance: mode=max
          sbom: true
